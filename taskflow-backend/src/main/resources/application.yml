server:
  port: 8080

spring:
  application:
    name: taskflow-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:taskflow_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

jwt:
  secret: TaskFlowSecretKeyForJWTTokenGenerationRequirement32BytesLongString!
  expiration: 86400000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
