services:
  # React Frontend Static Site
  - type: web
    name: taskflow-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://taskflow-backend-y1c0.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Unified Spring Boot Java Backend Service
  - type: web
    name: taskflow-backend
    env: docker
    plan: free
    dockerfilePath: ./taskflow-backend/Dockerfile
