services:
  # React Frontend Static Site
  - type: web
    name: taskflow-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://taskflow-gateway.onrender.com/api

  # Spring Cloud API Gateway
  - type: web
    name: taskflow-gateway
    env: docker
    dockerfilePath: ./api-gateway/Dockerfile
    envVars:
      - key: AUTH_SERVICE_URL
        value: http://taskflow-auth:8081
      - key: USER_SERVICE_URL
        value: http://taskflow-user:8082
      - key: TASK_SERVICE_URL
        value: http://taskflow-task:8083
      - key: NOTIFICATION_SERVICE_URL
        value: http://taskflow-notification:8084

  # Auth Service
  - type: web
    name: taskflow-auth
    env: docker
    dockerfilePath: ./auth-service/Dockerfile

  # User Service
  - type: web
    name: taskflow-user
    env: docker
    dockerfilePath: ./user-service/Dockerfile

  # Task Service
  - type: web
    name: taskflow-task
    env: docker
    dockerfilePath: ./task-service/Dockerfile

  # Notification Service
  - type: web
    name: taskflow-notification
    env: docker
    dockerfilePath: ./notification-service/Dockerfile
