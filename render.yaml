services:
  # React Frontend Static Site (FREE $0/mo)
  - type: web
    name: taskflow-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://taskflow-backend.onrender.com/api

  # Unified Spring Boot Java Backend Service (FREE $0/mo)
  - type: web
    name: taskflow-backend
    env: docker
    plan: free
    dockerfilePath: ./taskflow-backend/Dockerfile
